compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
enable_cpu_affinity: false
fsdp_config:
  fsdp_activation_checkpointing: false  # the model already enables HF gradient checkpointing (inbatch._load_retriever); FSDP AC on top recomputed every layer twice
  # TRANSFORMER_BASED_WRAP finds no layer class here (the outer wrapper model defines no
  # _no_split_modules), so the whole model is ONE FSDP unit: one all-gather / reduce-scatter per
  # step. Keep it that way for multi-query training: the two ranks usually run different numbers
  # of generation steps (different gold counts k), and per-layer wrapping then hangs in backward
  # (reproduced with k=2 vs 5). Make both ranks draw the same k per step before changing this.
  # See reports/code_data_audit_2026-09-27.md, T4.
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: false
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_version: 1
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # must match finetuning_multi.py: Accelerator(mixed_precision="bf16") (bf16 autocast over fp32 weights)
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
